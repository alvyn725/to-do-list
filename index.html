<!DOCTYPE html>
<html>
  <head>
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="info-row">
      <p>Task Name</p>
      <p>Do Date</p>
      <p>Due Date</p>
    </div>
    <div class="input-row">
      <input placeholder="e.x. Walk my dog" class="js-task-name-input">
      <input type="date" class="js-do-date-input">
      <input type="date" class="js-due-date-input">
    </div>  

    <div class="js-task-list task-list"></div>
    <script src="script.js"></script>
  </body>
</html>
