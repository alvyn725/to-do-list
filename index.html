<!DOCTYPE html>
<html>
  <head>
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div class="layout">
      <div class="sidebar">sidebar</div>
      <div class="task-list-area">
        <div class="input-row">
          <div class="input-row-section">
            <label for="task-name">Task Name</label>
            <input placeholder="e.g. Walk my dog" class="js-task-name-input" id="task-name">    
          </div>
          <div class="input-row-section">
            <label for="status">Status</label>
            <select id="status" class="js-status-input">
              <option selected>Not Started</option>
              <option>In Progress</option>
              <option>Complete</option>
            </select>
          </div>
          <div class="input-row-section">
            <label for="subject">Subject</label>
            <select id="subject" class="js-subject-input">
              <option selected>English</option>
              <option>Math</option>
              <option>Science</option>
              <option>Mother Tounge</option>
            </select>
          </div>
          <div class="input-row-section">
            <label for="do-date">Do Date</label>
            <input type="date" class="js-do-date-input" id="do-date">
          </div>
          <div class="input-row-section">
            <label for="due-date">Due Date</label>
            <input type="date" class="js-due-date-input" id="due-date">
          </div>
          <div class="input-row-section">
            <label for="notes">Notes</label>
            <input placeholder="e.g Make sure walk him along Oak Street" class="js-notes-input" id="notes">
          </div>
        </div>  
        <button class="js-add-button add-button">Add</button>
    
        <div class="js-task-list task-list"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
